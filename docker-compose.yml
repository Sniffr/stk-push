version: '3.8'

services:
  soldout-payment-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soldout-payment-app
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - soldout-network

networks:
  soldout-network:
    driver: bridge
